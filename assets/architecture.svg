<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="895" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ec4899"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="895" fill="#0d0d1a"/>

  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" fill="white" font-size="18" font-weight="bold">Music Viber AI — System Architecture</text>
  <text x="425" y="46" text-anchor="middle" fill="#475569" font-size="11">React · FastAPI · Gemini 2.5 Flash · Qdrant · sentence-transformers</text>

  <!-- ===== FRONTEND ===== -->
  <rect x="25" y="55" width="792" height="148" rx="10" fill="#111122" stroke="#f59e0b" stroke-width="2"/>
  <text x="421" y="73" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold" letter-spacing="2">REACT FRONTEND</text>

  <!-- Profile Panel -->
  <rect x="38" y="81" width="340" height="108" rx="6" fill="#1e1204" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="208" y="98" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">Profile Panel  (always visible)</text>
  <text x="208" y="113" text-anchor="middle" fill="#d4a055" font-size="8.5">genre · mood · energy slider</text>
  <text x="208" y="126" text-anchor="middle" fill="#d4a055" font-size="8.5">decade · mood_tag · likes_acoustic</text>
  <text x="208" y="139" text-anchor="middle" fill="#d4a055" font-size="8.5">🎲 Randomize</text>
  <text x="208" y="153" text-anchor="middle" fill="#d4a055" font-size="8.5">Scoring Mode: balanced / genre_first / mood_first / energy_focused</text>
  <text x="208" y="167" text-anchor="middle" fill="#fbbf24" font-size="8">→ always included as profile: {}</text>

  <!-- Optional add-ons header -->
  <text x="538" y="90" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="bold" letter-spacing="1">OPTIONAL ADD-ONS</text>

  <!-- Describe card -->
  <rect x="393" y="95" width="197" height="48" rx="5" fill="#0d1a12" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="5,2"/>
  <text x="491" y="112" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="bold">✍️  Describe what you want</text>
  <text x="491" y="126" text-anchor="middle" fill="#86efac" font-size="8">Textarea → query: "..."</text>
  <text x="491" y="138" text-anchor="middle" fill="#86efac" font-size="7.5">toggle · null when off</text>

  <!-- Songs card -->
  <rect x="393" y="149" width="197" height="48" rx="5" fill="#0d1a12" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="5,2"/>
  <text x="491" y="165" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="bold">🎧  Songs I've Heard</text>
  <text x="491" y="179" text-anchor="middle" fill="#86efac" font-size="8">Tag input → songs: [...]</text>
  <text x="491" y="191" text-anchor="middle" fill="#86efac" font-size="7.5">toggle · null when off</text>

  <!-- Submit area -->
  <rect x="599" y="95" width="208" height="102" rx="5" fill="#1a0a2e" stroke="#6366f1" stroke-width="1.2"/>
  <text x="703" y="114" text-anchor="middle" fill="#a5b4fc" font-size="9" font-weight="bold">POST /recommend</text>
  <text x="703" y="129" text-anchor="middle" fill="#c7d2fe" font-size="8">profile: {}  (always)</text>
  <text x="703" y="143" text-anchor="middle" fill="#c7d2fe" font-size="8">query: "..." | null</text>
  <text x="703" y="157" text-anchor="middle" fill="#c7d2fe" font-size="8">songs: [...] | null</text>
  <text x="703" y="171" text-anchor="middle" fill="#c7d2fe" font-size="8">mode: "balanced"</text>
  <text x="703" y="185" text-anchor="middle" fill="#818cf8" font-size="7.5">→ GET /random-profile available</text>

  <!-- Arrow Frontend → Backend -->
  <line x1="421" y1="203" x2="421" y2="224" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== BACKEND ===== -->
  <rect x="25" y="226" width="792" height="412" rx="10" fill="#090918" stroke="#6366f1" stroke-width="2"/>
  <text x="421" y="245" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="bold" letter-spacing="2">FASTAPI BACKEND  —  /recommend pipeline</text>

  <!-- Step 1: Synthesize (conditional) -->
  <rect x="98" y="252" width="626" height="56" rx="6" fill="#12031e" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="98" y="252" width="118" height="16" rx="3" fill="#a855f7"/>
  <text x="157" y="263" text-anchor="middle" fill="white" font-size="8" font-weight="bold">①  CONDITIONAL</text>
  <text x="421" y="271" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="bold">Gemini: synthesize_inputs(profile, query, songs)</text>
  <text x="421" y="285" text-anchor="middle" fill="#d8b4fe" font-size="8.5">Called only when at least one add-on is active</text>
  <text x="421" y="297" text-anchor="middle" fill="#d8b4fe" font-size="8">Blends base profile + text description + song list → one refined prefs dict  ·  Skipped when no add-ons</text>

  <!-- Arrow ①→② -->
  <line x1="421" y1="308" x2="421" y2="319" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Guardrails -->
  <rect x="98" y="321" width="626" height="52" rx="6" fill="#1e0303" stroke="#ef4444" stroke-width="1.5"/>
  <text x="421" y="338" text-anchor="middle" fill="#f87171" font-size="10" font-weight="bold">②  Guardrails Validation  (always runs)</text>
  <text x="421" y="352" text-anchor="middle" fill="#fca5a5" font-size="8">classical + energy &gt; 0.7  ·  acoustic + energy &gt; 0.8  ·  unknown genre or mood</text>
  <text x="421" y="364" text-anchor="middle" fill="#fca5a5" font-size="8">Non-blocking → returns warnings[] displayed as UI banner</text>

  <!-- Arrow ②→③ -->
  <line x1="421" y1="373" x2="421" y2="384" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Step 3: Embed -->
  <rect x="98" y="386" width="626" height="52" rx="6" fill="#021a02" stroke="#22c55e" stroke-width="1.5"/>
  <text x="421" y="403" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">③  Embed Preferences  —  sentence-transformers</text>
  <text x="421" y="417" text-anchor="middle" fill="#86efac" font-size="8">all-MiniLM-L6-v2  ·  prefs dict → text string → 384-dim float vector  ·  100% local, no API key</text>
  <text x="421" y="429" text-anchor="middle" fill="#86efac" font-size="7.5">"genre:lofi mood:chill energy:0.4 acoustic:yes decade:2020 mood_tag:peaceful"</text>

  <!-- Arrow ③→④ -->
  <line x1="421" y1="438" x2="421" y2="449" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Step 4: Qdrant -->
  <rect x="98" y="451" width="626" height="52" rx="6" fill="#011c1c" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="421" y="468" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="bold">④  Qdrant Vector Search  —  RAG</text>
  <text x="421" y="482" text-anchor="middle" fill="#67e8f9" font-size="8">ANN cosine similarity: prefs vector vs 102 pre-embedded songs  →  top 50 candidates</text>
  <text x="421" y="494" text-anchor="middle" fill="#67e8f9" font-size="8">Local embedded (qdrant_data/)  or  Qdrant Cloud  via QDRANT_URL + QDRANT_API_KEY</text>

  <!-- Arrow ④→⑤ -->
  <line x1="421" y1="503" x2="421" y2="514" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Step 5: Re-rank -->
  <rect x="98" y="516" width="626" height="56" rx="6" fill="#1a1a02" stroke="#eab308" stroke-width="1.5"/>
  <text x="421" y="533" text-anchor="middle" fill="#facc15" font-size="10" font-weight="bold">⑤  recommender.py  —  Deterministic Re-rank</text>
  <text x="421" y="547" text-anchor="middle" fill="#fde047" font-size="8">Weighted scorer: genre · mood · energy · acousticness · decade · mood_tag · popularity</text>
  <text x="421" y="561" text-anchor="middle" fill="#fde047" font-size="8">4 scoring modes  ·  Diversity filter (max 2/artist, max 2/genre)  →  Top 5 songs</text>

  <!-- Arrow ⑤→⑥ -->
  <line x1="421" y1="572" x2="421" y2="583" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Step 6: Explain -->
  <rect x="98" y="585" width="626" height="44" rx="6" fill="#12031e" stroke="#a855f7" stroke-width="1.5"/>
  <text x="421" y="601" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="bold">⑥  Gemini: generate_explanations(top 3 songs)</text>
  <text x="421" y="617" text-anchor="middle" fill="#d8b4fe" font-size="8">Single batched API call · 3 natural-language explanation strings · Falls back to rule-based reasons on error</text>

  <!-- Arrow Backend → Results -->
  <line x1="421" y1="638" x2="421" y2="658" stroke="#ec4899" stroke-width="2" marker-end="url(#arrowPink)"/>

  <!-- ===== RESULTS + FEEDBACK ===== -->
  <rect x="25" y="660" width="792" height="160" rx="10" fill="#150a15" stroke="#ec4899" stroke-width="2"/>
  <text x="421" y="678" text-anchor="middle" fill="#f472b6" font-size="11" font-weight="bold" letter-spacing="2">RESULTS + AGENTIC FEEDBACK LOOP</text>

  <!-- Results box -->
  <rect x="38" y="685" width="350" height="124" rx="6" fill="#200a20" stroke="#ec4899" stroke-width="1.5"/>
  <text x="213" y="701" text-anchor="middle" fill="#f9a8d4" font-size="10" font-weight="bold">Results Panel</text>
  <text x="213" y="716" text-anchor="middle" fill="#fbcfe8" font-size="8">Top 5 songs · score bar · ✦ AI explanation per song</text>
  <text x="213" y="729" text-anchor="middle" fill="#fbcfe8" font-size="8">Warnings banner if any guardrails fired</text>
  <text x="213" y="742" text-anchor="middle" fill="#fbcfe8" font-size="8">Diff banner on retry  e.g.  energy 0.4 → 0.7</text>
  <text x="213" y="760" text-anchor="middle" fill="#f9a8d4" font-size="9" font-weight="bold">[  ✓  Satisfied  ]    [  ✗  Not Satisfied  ]</text>
  <text x="213" y="775" text-anchor="middle" fill="#fbcfe8" font-size="8">Deterministic: same prefs → same top 5 every run</text>
  <text x="213" y="789" text-anchor="middle" fill="#fbcfe8" font-size="8">5 profile test-cases verified by eval harness</text>

  <!-- Feedback box -->
  <rect x="400" y="685" width="404" height="124" rx="6" fill="#200a20" stroke="#ec4899" stroke-width="1.5"/>
  <text x="602" y="701" text-anchor="middle" fill="#f9a8d4" font-size="10" font-weight="bold">Feedback → Retry  (capped at 1)</text>
  <text x="602" y="716" text-anchor="middle" fill="#fbcfe8" font-size="8">FeedbackDialog: free-text "why didn't you like it?"</text>
  <text x="602" y="729" text-anchor="middle" fill="#fbcfe8" font-size="8">POST /recommend/retry</text>
  <text x="602" y="742" text-anchor="middle" fill="#fbcfe8" font-size="8">Gemini: adjust_preferences(original_query, feedback, prev_prefs)</text>
  <text x="602" y="755" text-anchor="middle" fill="#f472b6" font-size="8">Returns new_prefs + diff  ·  Re-runs pipeline from step ③</text>
  <text x="602" y="768" text-anchor="middle" fill="#fbcfe8" font-size="8">Shows what changed in a diff banner</text>
  <text x="602" y="782" text-anchor="middle" fill="#fbcfe8" font-size="8">One retry only — prevents prompt growth</text>

  <!-- Feedback loop arrow: right of results panel → up left side → step ③ -->
  <path d="M 817 742 Q 829 742 829 415 Q 829 386 724 412" stroke="#ec4899" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowPink)"/>
  <text x="843" y="597" fill="#f472b6" font-size="8" transform="rotate(90,843,597)">retry → re-run from ③</text>

  <!-- ===== EXTERNAL SERVICES ===== -->

  <!-- Gemini API -->
  <rect x="842" y="252" width="232" height="84" rx="8" fill="#12031e" stroke="#a855f7" stroke-width="1.5"/>
  <text x="958" y="272" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="bold">Gemini 2.5 Flash</text>
  <text x="958" y="287" text-anchor="middle" fill="#d8b4fe" font-size="8">google-genai SDK</text>
  <text x="958" y="300" text-anchor="middle" fill="#d8b4fe" font-size="8">① synthesize_inputs</text>
  <text x="958" y="313" text-anchor="middle" fill="#d8b4fe" font-size="8">⑥ generate_explanations</text>
  <text x="958" y="326" text-anchor="middle" fill="#d8b4fe" font-size="8">retry: adjust_preferences</text>
  <line x1="842" y1="294" x2="724" y2="280" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Qdrant -->
  <rect x="842" y="348" width="232" height="82" rx="8" fill="#011c1c" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="958" y="367" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="bold">Qdrant Vector DB</text>
  <text x="958" y="382" text-anchor="middle" fill="#67e8f9" font-size="8">Local: QdrantClient(path="qdrant_data/")</text>
  <text x="958" y="395" text-anchor="middle" fill="#67e8f9" font-size="8">Cloud: QDRANT_URL + QDRANT_API_KEY</text>
  <text x="958" y="408" text-anchor="middle" fill="#67e8f9" font-size="8">collection: songs · vector_size: 384</text>
  <text x="958" y="421" text-anchor="middle" fill="#67e8f9" font-size="7.5">build_index.py seeds on first run</text>
  <line x1="842" y1="389" x2="724" y2="478" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- sentence-transformers -->
  <rect x="842" y="444" width="232" height="76" rx="8" fill="#021a02" stroke="#22c55e" stroke-width="1.5"/>
  <text x="958" y="462" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">sentence-transformers</text>
  <text x="958" y="477" text-anchor="middle" fill="#86efac" font-size="8">all-MiniLM-L6-v2  ·  384-dim</text>
  <text x="958" y="490" text-anchor="middle" fill="#86efac" font-size="8">Runs 100% locally  ·  ~80 MB</text>
  <text x="958" y="503" text-anchor="middle" fill="#86efac" font-size="8">No API key needed</text>
  <line x1="842" y1="482" x2="724" y2="414" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- songs.json -->
  <rect x="842" y="534" width="232" height="72" rx="8" fill="#1a1a02" stroke="#eab308" stroke-width="1.5"/>
  <text x="958" y="553" text-anchor="middle" fill="#facc15" font-size="10" font-weight="bold">songs.json  (catalog)</text>
  <text x="958" y="568" text-anchor="middle" fill="#fde047" font-size="8">102 songs  ·  15 genres  ·  7 moods</text>
  <text x="958" y="581" text-anchor="middle" fill="#fde047" font-size="8">9 mood tags  ·  full audio features</text>
  <text x="958" y="594" text-anchor="middle" fill="#fde047" font-size="7.5">data/new_data/songs.json</text>
  <line x1="842" y1="570" x2="724" y2="544" stroke="#eab308" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- ===== LEGEND ===== -->
  <rect x="25" y="835" width="792" height="38" rx="6" fill="#0d0d1a" stroke="#1e2240" stroke-width="1"/>
  <text x="46" y="851" fill="#e2e8f0" font-size="9" font-weight="bold">AI FEATURES:</text>

  <circle cx="135" cy="854" r="5" fill="#a855f7"/>
  <text x="145" y="858" fill="#d8b4fe" font-size="9">Gemini LLM</text>

  <circle cx="218" cy="854" r="5" fill="#22c55e"/>
  <text x="228" y="858" fill="#86efac" font-size="9">RAG / Vector Search</text>

  <circle cx="340" cy="854" r="5" fill="#ec4899"/>
  <text x="350" y="858" fill="#fbcfe8" font-size="9">Agentic Feedback Loop</text>

  <circle cx="480" cy="854" r="5" fill="#ef4444"/>
  <text x="490" y="858" fill="#fca5a5" font-size="9">Guardrails</text>

  <circle cx="556" cy="854" r="5" fill="#eab308"/>
  <text x="566" y="858" fill="#fde047" font-size="9">Deterministic Scorer</text>

  <circle cx="674" cy="854" r="5" fill="#06b6d4"/>
  <text x="684" y="858" fill="#67e8f9" font-size="9">Qdrant Embeddings</text>

  <circle cx="766" cy="854" r="5" fill="#f59e0b"/>
  <text x="776" y="858" fill="#fcd34d" font-size="9">React UI</text>
</svg>
